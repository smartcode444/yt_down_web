<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            body {
                margin: 0;
                /* padding: 0; */
                font-family: JetBrains Mono, Arial, sans-serif;
                background-color: #ffffff;
            }

            .page {
                min-height: 100vh; 
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }   

            .input-container {
                flex-direction: column;
            }

            #url {
                width: 300px;
                height: 30px;
                margin-bottom: 10px;
            }

            .download_button {
                font-size: 16px;
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
            }
            
            .download_button:hover {
                background-color: #0f3611;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <h1 >Youtube Downloader</h1>
            <div class="input-container">
                <label for="url">Enter URL:</label>
                <input type="text" id="url" name="url" required>
                <button class="download_button">Download</button>
            </div>
        </div>
    </body>
</html>
