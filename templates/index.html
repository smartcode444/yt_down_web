<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <style>
            body {
                margin: 0;
                /* padding: 0; */
                font-family: JetBrains Mono, Arial, sans-serif;
                background-color: #ffffff;
            }

            .page {
                min-height: 100vh; 
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }   

            .input-container {
                flex-direction: column;
            }

            #url {
                width: 300px;
                height: 30px;
                margin-bottom: 10px;
            }

            .download_button {
                font-size: 16px;
                padding: 10px 20px;
                background-color: #4CAF50;
                color: white;
                border: none;
                cursor: pointer;
            }
            
            .download_button:hover {
                background-color: #0f3611;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <h1 >Youtube Downloader -- {{ title }}</h1>
            <div class="input-container">
                <label for="url">Enter URL:</label>
                <input type="text" id="url" name="url" required>
                <button class="download_button">Download</button>
            </div>

            <p id="response-text"></p>

        </div>
        <script>
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const downloadButton = document.querySelector('.download_button');
            const urlInput = document.getElementById('url')
            const responseText = document.getElementById('response-text');

            downloadButton.addEventListener('click', async function() {
                const url = urlInput.value;
                responseText.textContent = 'Downloading...';
                
                await sleep(3000); // Wait for 3 seconds

                responseText.textContent = 'Download complete!';
            });

        </script>
    </body>
</html>
